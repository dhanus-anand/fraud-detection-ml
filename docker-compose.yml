version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fraud-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fraud_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraud_password}
      POSTGRES_DB: ${POSTGRES_DB:-fraud_db}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-fraud_user}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fraud-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.2
    container_name: fraud-mlflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER:-fraud_user}:${POSTGRES_PASSWORD:-fraud_password}@postgres:5432/${POSTGRES_DB:-fraud_db}
      MLFLOW_ARTIFACT_ROOT: /mlruns
    volumes:
      - mlruns_data:/mlruns
    ports:
      - '5000:5000'
    command: mlflow server --host 0.0.0.0 --port 5000

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fraud_user}:${POSTGRES_PASSWORD:-fraud_password}@postgres:5432/${POSTGRES_DB:-fraud_db}
      REDIS_URL: redis://redis:6379
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_VERSION: production
    volumes:
      - mlruns_data:/app/mlruns
    ports:
      - '8000:8000'

volumes:
  postgres_data:
  redis_data:
  mlruns_data:
